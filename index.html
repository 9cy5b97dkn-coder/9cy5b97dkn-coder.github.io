<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FinTrack">
<meta name="theme-color" content="#f4f0e6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Money%20bag/3D/money_bag_3d.png">
<title>FinTrack — мой капитал</title>
<style>
body{margin:0;background:#f4f0e6;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#5b5344}
#ld{text-align:center;padding:24px;line-height:1.6}
.sp{width:42px;height:42px;margin:0 auto 14px;border:4px solid #e5ddc9;border-top-color:#8b6f4e;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div>Загрузка FinTrack…</div>
<script>
var PATCH={"c1.txt":[[3845,1,"v"],[4084,1,"b"],[5175,1,"S"],[5335,1,"2"],[6453,1,"k"],[6924,1,"w"]],"c2.txt":[[2222,1,"0"],[2725,1,"V"],[2997,1,"q"],[8302,1,"V"]],"c3.txt":[[1586,1,"Z"],[2019,1,"2"],[2291,1,"2"],[2416,1,"v"],[3391,1,"v"],[3982,1,"w"],[4103,1,"X"],[5007,1,"1"],[5075,1,"k"],[5481,1,"v"],[6069,1,"V"],[6202,1,"q"],[6400,1,"v"],[7561,1,"G"],[7823,1,"T"],[8016,1,"K"],[8052,1,"v"],[8536,1,"X"]],"c4.txt":[[964,1,"V"],[1092,1,"V"],[1362,1,"q"],[1725,1,"w"],[2942,1,"q"],[3129,1,"1"],[3858,1,"+"],[4187,1,"k"],[4693,1,"q"],[4703,1,"w"],[5772,1,"V"],[6196,1,"w"],[6225,1,"V"],[6627,1,"O"],[6846,1,"v"],[6916,1,"G"],[7421,1,"F"],[7483,1,"w"],[7667,1,"v"],[8083,1,"G"],[8093,1,"v"],[8344,1,"k"],[8476,2,"Ve"],[8482,1,"x"]],"c5.txt":[[176,1,"q"],[2261,1,"q"],[2376,1,"h"],[3885,1,"v"],[3953,1,"V"],[4082,0,"t"],[4083,1,""],[4136,1,"V"],[5171,1,"W"],[5738,1,"V"],[7047,1,"u"],[7487,1,"q"],[7733,1,"w"],[8342,1,"w"]]};
function ap(s,ops){var off=0;for(var k=0;k<ops.length;k++){var o=ops[k],p=o[0]+off;s=s.slice(0,p)+o[2]+s.slice(p+o[1]);off+=o[2].length-o[1];}return s}
async function boot(){
try{
var names=['c1.txt','c2.txt','c3.txt','c4.txt','c5.txt'],parts=[];
for(var i=0;i<names.length;i++){
var r=await fetch(names[i],{cache:'no-store'});
if(!r.ok)throw 0;
parts.push(ap(await r.text(),PATCH[names[i]]));
}
var bin=atob(parts.join('').replace(/\s+/g,''));
var bytes=new Uint8Array(bin.length);
for(var j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
var html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
if(html.indexOf('FinTrack')<0||html.indexOf('ft_v3')<0)throw 0;
document.open();document.write(html);document.close();
}catch(e){
document.getElementById('ld').innerHTML='Не удалось загрузить приложение 😔<br><br>Проверьте интернет и обновите страницу.';
}
}
boot();
</script>
</body>
</html>
